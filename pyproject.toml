[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillkit"
description = "Structural validation and behavioral evaluation tooling for Agent Skill collections."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Richard Povinelli" }]
dependencies = ["pyyaml"]
dynamic = ["version"]

[project.scripts]
skillkit-validate = "skillkit.validate:main"
skillkit-evals = "skillkit.evals.runner.__main__:main"

[dependency-groups]
dev = [
    "pytest",
    "pyright",
]

[tool.setuptools.dynamic]
version = { attr = "skillkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"skillkit.evals.runner" = ["data/shims/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
